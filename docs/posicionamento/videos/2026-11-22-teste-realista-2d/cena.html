<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Montserrat";src:url("fonts/montserrat-latin.woff2") format("woff2");font-weight:100 900;}
:root{--navy:#0B1A3A;--blue:#3B8BFF;--blue2:#1F5FD6;--ink2:#3A4A66;--red:#E5384A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#EAF0FA;font-family:"Montserrat",Inter,Arial,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(900px 760px at 50% 34%,#FFFFFF 0%,#F7F9FD 35%,#EAF0FA 70%,#DCE5F4 100%)}
.abs{position:absolute;will-change:transform,opacity}
#rays{left:-660px;top:-440px;width:2400px;height:2400px;
  background:repeating-conic-gradient(from 0deg,rgba(59,139,255,.13) 0 8deg,rgba(59,139,255,0) 8deg 16deg);
  -webkit-mask-image:radial-gradient(circle at center,#000 0%,rgba(0,0,0,.0) 46%);mask-image:radial-gradient(circle at center,#000 0%,rgba(0,0,0,0) 46%)}
.house{opacity:.16}
#dots{left:0;top:78px;width:1080px;height:90px;display:flex;justify-content:center;align-items:center;gap:20px}
.dot{width:54px;height:54px;border-radius:50%;background:#CBD9F1;color:#6F83A8;font-weight:800;font-size:28px;
  display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 4px 0 rgba(11,26,58,.10)}
.dot.on{width:84px;height:84px;font-size:46px;color:#fff;background:linear-gradient(135deg,#4C8DF6,#1F4CB3);border:5px solid var(--navy);box-shadow:0 6px 0 rgba(11,26,58,.25)}
#labelWrap{left:0;top:186px;width:1080px;display:flex;justify-content:center}
#label{background:var(--navy);color:#fff;font-weight:900;font-size:74px;letter-spacing:1px;text-transform:uppercase;line-height:1;
  padding:20px 46px 22px;border-radius:20px;box-shadow:0 10px 0 var(--blue);white-space:nowrap}
#sub{left:0;top:322px;width:1080px;text-align:center;font-weight:800;font-size:44px;letter-spacing:2px;text-transform:uppercase;color:var(--navy)}
#sub .neg{color:var(--red)} #sub .pos{color:var(--blue2)}
.char{left:0;top:380px;height:900px;transform-origin:50% 100%;filter:drop-shadow(0 20px 26px rgba(11,26,58,.28))}
#panel{left:0;top:1235px;width:1080px;height:760px;background:linear-gradient(180deg,#112552 0%,#0B1A3A 60%);
  border-radius:70px 70px 0 0;border-top:10px solid var(--blue);box-shadow:0 -14px 40px rgba(11,26,58,.18)}
#cap{left:60px;top:1290px;width:960px;height:170px;color:#fff;font-weight:900;font-size:84px;line-height:1.08;text-align:center;
  display:flex;align-items:center;justify-content:center;transform-origin:50% 50%}
#cap .neg{color:#FF6A63} #cap .pos{color:#74AEFF}
.doc{width:300px;height:380px;transform-origin:50% 50%;filter:drop-shadow(0 18px 22px rgba(11,26,58,.30))}
.badge{width:96px;height:96px;transform-origin:50% 50%}
#magn{width:200px;height:200px;transform-origin:20% 20%;filter:drop-shadow(0 10px 12px rgba(11,26,58,.30))}
#wm{height:48px;opacity:.30}
.pt{width:20px;height:20px;border-radius:50%}
</style></head>
<body><div id="stage">
  <div id="rays" class="abs"></div>
  <div id="houses"></div>

  <!-- personagem (recortes da biblioteca realista do dono) -->
  <img id="charA" class="abs char" src="img/desespero.png">
  <img id="charB" class="abs char" src="img/explicando.png">

  <!-- adereços 2D -->
  <div id="docA" class="abs doc" style="left:748px;top:790px">
    <svg viewBox="0 0 300 380" width="300" height="380">
      <rect x="6" y="6" width="288" height="368" rx="26" fill="#fff" stroke="#0B1A3A" stroke-width="7"/>
      <rect x="6" y="6" width="288" height="70" rx="26" fill="#0B1A3A"/><rect x="6" y="46" width="288" height="30" fill="#0B1A3A"/>
      <text x="30" y="54" font-family="Montserrat" font-weight="900" font-size="27" fill="#fff" letter-spacing="2">CONTRATO</text>
      <g fill="#C5D0E4"><rect x="34" y="110" width="232" height="14" rx="7"/><rect x="34" y="140" width="190" height="14" rx="7"/><rect x="34" y="170" width="232" height="14" rx="7"/>
      <rect x="34" y="200" width="150" height="14" rx="7"/><rect x="34" y="230" width="232" height="14" rx="7"/><rect x="34" y="260" width="200" height="14" rx="7"/></g>
      <path d="M40 340 q30 -34 52 -6 t50 -2" fill="none" stroke="#0B1A3A" stroke-width="6" stroke-linecap="round"/>
      <rect x="150" y="338" width="110" height="5" rx="2.5" fill="#9AA9C6"/>
    </svg>
    <div id="badgeA" class="abs badge" style="left:236px;top:-58px">
      <svg viewBox="0 0 96 96" width="96" height="96"><circle cx="48" cy="48" r="44" fill="#E5384A" stroke="#0B1A3A" stroke-width="6"/>
      <rect x="42" y="22" width="12" height="34" rx="6" fill="#fff"/><circle cx="48" cy="69" r="7" fill="#fff"/></svg>
    </div>
  </div>

  <div id="docB" class="abs doc" style="left:46px;top:560px">
    <svg viewBox="0 0 300 380" width="300" height="380">
      <rect x="6" y="6" width="288" height="368" rx="26" fill="#fff" stroke="#0B1A3A" stroke-width="7"/>
      <rect x="6" y="6" width="288" height="70" rx="26" fill="#0B1A3A"/><rect x="6" y="46" width="288" height="30" fill="#0B1A3A"/>
      <text x="30" y="54" font-family="Montserrat" font-weight="900" font-size="27" fill="#fff" letter-spacing="2">CONTRATO</text>
      <rect id="hl" x="26" y="100" width="0" height="36" rx="10" fill="#BFD6FF"/>
      <g fill="#C5D0E4"><rect x="34" y="110" width="232" height="14" rx="7"/><rect x="34" y="140" width="190" height="14" rx="7"/><rect x="34" y="170" width="232" height="14" rx="7"/>
      <rect x="34" y="200" width="150" height="14" rx="7"/><rect x="34" y="230" width="232" height="14" rx="7"/><rect x="34" y="260" width="200" height="14" rx="7"/></g>
      <path d="M40 340 q30 -34 52 -6 t50 -2" fill="none" stroke="#0B1A3A" stroke-width="6" stroke-linecap="round"/>
      <rect x="150" y="338" width="110" height="5" rx="2.5" fill="#9AA9C6"/>
    </svg>
    <div id="badgeB" class="abs badge" style="left:236px;top:-58px">
      <svg viewBox="0 0 96 96" width="96" height="96"><circle cx="48" cy="48" r="44" fill="#1F5FD6" stroke="#0B1A3A" stroke-width="6"/>
      <path d="M26 50 l16 16 l30 -34" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <svg id="magn" class="abs" viewBox="0 0 200 200">
    <circle cx="78" cy="78" r="56" fill="rgba(191,214,255,.45)" stroke="#0B1A3A" stroke-width="10"/>
    <path d="M62 52 a34 34 0 0 1 26 -8" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <path d="M118 118 L178 178" stroke="#0B1A3A" stroke-width="22" stroke-linecap="round"/>
    <path d="M118 118 L170 170" stroke="#3B8BFF" stroke-width="8" stroke-linecap="round"/>
  </svg>

  <div id="panel" class="abs"></div>
  <div id="panelTex" class="abs" style="left:0;top:1235px;width:1080px;height:685px;pointer-events:none;overflow:hidden"></div>
  <div id="cap" class="abs"></div>

  <div id="dots" class="abs"></div>
  <div id="labelWrap" class="abs"><div id="label"></div></div>
  <div id="sub" class="abs"></div>

  <img id="wm" class="abs" src="symbol.png">
  <div id="burst"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eOutCubic=x=>1-Math.pow(1-x,3);
const eOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const set=(el,{x=0,y=0,s=1,sx=null,sy=null,r=0,o=1})=>{el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${sx??s},${sy??s})`;el.style.opacity=o};

/* ---- montagem ---- */
const T_OUT=3.85, T_IN=4.2;                       // troca de pose
const dots=$("#dots"); for(let i=1;i<=5;i++){const d=document.createElement("div");d.className="dot";d.textContent=i;dots.appendChild(d);} const dotEls=[...dots.children];
// casinhas decorativas (posições fixas)
const HOUSE=[[90,520,54,.0],[960,470,64,.3],[130,1010,44,.6],[980,1000,58,.15],[60,760,40,.45],[1010,720,46,.8],[500,1180,36,.5],[220,420,38,.9]];
const houses=$("#houses"); HOUSE.forEach(h=>{const e=document.createElement("div");e.className="abs house";e.style.left=h[0]+"px";e.style.top=h[1]+"px";
  e.innerHTML=`<svg viewBox="0 0 64 64" width="${h[2]}" height="${h[2]}"><path d="M8 30 L32 8 L56 30 V56 H8 Z M26 56 V38 H38 V56" fill="none" stroke="#3B8BFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;houses.appendChild(e);e._p=h;});
// legenda em frases curtas (como nos Reels): [início, fim, html]
const CHUNKS=[[1.0,1.9,"Você assina"],[1.9,2.8,'<span class="neg">sem ler</span>'],[2.8,3.85,"o contrato inteiro…"],
              [4.5,5.3,"Leia"],[5.3,6.2,'<span class="pos">antes</span> de assinar.'],[6.2,8.0,"Sem pressa."]];
const cap=$("#cap");
{ const tex=$("#panelTex"); [[830,250,70],[900,330,52],[640,520,44],[120,300,60],[300,560,40],[960,560,64]].forEach(h=>{const e=document.createElement("div");e.style.cssText=`position:absolute;left:${h[0]}px;top:${h[1]}px;opacity:.07`;
  e.innerHTML=`<svg viewBox="0 0 64 64" width="${h[2]}" height="${h[2]}"><path d="M8 30 L32 8 L56 30 V56 H8 Z M26 56 V38 H38 V56" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;tex.appendChild(e);}); }

/* ---- linha do tempo ---- */
window.render=function(t){
  // fundo
  set($("#rays"),{r:t*5,o:1});
  houses.childNodes.forEach(e=>{const p=e._p;const y=-((t*14+p[3]*120)%140);set(e,{y:y,x:Math.sin(t*0.8+p[3]*6)*6,o:clamp(seg(t,0.2,0.9))*.9});});
  // bolinhas
  dotEls.forEach((d,i)=>{const k=eOutBack(seg(t,0.15+i*0.07,0.55+i*0.07));d.classList.toggle("on",i===0); set(d,{s:Math.max(0.001,k),o:clamp(k*2)});});
  // etiqueta + subtítulo (muda na troca)
  const inB=t>=T_OUT+0.12;
  const lab=$("#label"), sub=$("#sub");
  const txtLabel=inB?"O certo":"Erro 1 · Contrato";
  if(lab.textContent!==txtLabel){lab.textContent=txtLabel; sub.innerHTML=inB?'Ler <span class="pos">cada cláusula</span>':'Assinar <span class="neg">sem ler</span>';}
  let ls;
  if(t<T_OUT){ls=eOutBack(seg(t,0.45,0.95));set($("#labelWrap"),{y:(1-seg(t,0.45,0.9))*-160,s:1,o:clamp(seg(t,0.45,0.7))});}
  else{const a=1-eInOut(seg(t,T_OUT,T_OUT+0.12)); const b=eOutBack(seg(t,T_OUT+0.12,T_IN+0.1)); const k=t<T_OUT+0.12?a:b; set($("#labelWrap"),{sy:Math.max(0.001,k),sx:1,o:1});}
  const sIn=seg(t,0.85,1.25), sOut=seg(t,T_OUT,T_OUT+0.12), sIn2=seg(t,T_OUT+0.2,T_IN+0.3);
  set(sub,{y:(1-(inB?eOutCubic(sIn2):eOutCubic(sIn)))*24,o:inB?sIn2:Math.min(sIn,1-sOut)});

  // painel + legenda
  const pk=eOutCubic(seg(t,0.25,0.85)); set($("#panel"),{y:(1-pk)*760}); set($("#panelTex"),{y:(1-pk)*760});
  { let ci=-1; CHUNKS.forEach((c,i)=>{if(t>=c[0]&&t<c[1])ci=i;});
    if(ci<0){set(cap,{o:0});}
    else{const c=CHUNKS[ci]; if(cap._i!==ci){cap.innerHTML='<div>'+c[2]+'</div>';cap._i=ci;}
      const k=eOutBack(seg(t,c[0],c[0]+0.26)), last=(ci===CHUNKS.length-1), f=last?1:1-seg(t,c[1]-0.08,c[1]);
      set(cap,{y:(1-k)*34,s:Math.max(0.01,0.82+0.18*k),o:clamp(seg(t,c[0],c[0]+0.1))*f}); } }

  // personagem A (problema) — pose "desespero"
  const A=$("#charA");
  { const k=eOutBack(seg(t,0.5,1.15)), ot=seg(t,T_OUT,T_OUT+0.3);
    const breath=1+0.010*Math.sin(t*2*Math.PI/2.6), sway=0.7*Math.sin(t*2*Math.PI/3.4);
    set(A,{x:(1-eOutCubic(seg(t,0.5,1.15)))*-120+ot*-90,y:(1-k)*160+ot*60,sy:breath*(0.94+0.06*k),sx:(0.94+0.06*k)/breath**0.5,r:sway,o:clamp(seg(t,0.5,0.8))*(1-ot)});
    A.style.left=((1080-A.naturalWidth*900/A.naturalHeight)/2+10)+"px"; }
  // personagem B (solução) — pose "explicando"
  const B=$("#charB");
  { const k=eOutBack(seg(t,T_IN,T_IN+0.6));
    const breath=1+0.010*Math.sin(t*2*Math.PI/2.6+1), sway=0.6*Math.sin(t*2*Math.PI/3.1+0.5);
    set(B,{x:(1-eOutCubic(seg(t,T_IN,T_IN+0.6)))*110,y:(1-k)*120,sy:breath*(0.94+0.06*k),sx:(0.94+0.06*k)/breath**0.5,r:sway,o:clamp(seg(t,T_IN,T_IN+0.25))});
    B.style.left=((1080-B.naturalWidth*900/B.naturalHeight)/2+105)+"px"; }

  // contrato A + selo "!"
  { const k=eOutBack(seg(t,1.05,1.6)), ot=eInOut(seg(t,T_OUT,T_OUT+0.22));
    const bob=Math.sin(t*2.2)*7;
    set($("#docA"),{y:bob,s:Math.max(0.001,k*(1-ot)),r:8+Math.sin(t*1.7)*1.6,o:1});
    const pulse=1+0.10*Math.sin(t*7)*seg(t,1.8,2.0);
    const shake=(t>2.3&&t<2.9)?Math.sin(t*60)*7:0;
    set($("#badgeA"),{s:eOutBack(seg(t,1.55,1.95))*pulse,r:shake,o:1}); }
  // contrato B + lupa + visto
  { const k=eOutBack(seg(t,4.75,5.3)), bob=Math.sin(t*2.0+1)*7;
    set($("#docB"),{y:bob,s:Math.max(0.001,k),r:-6+Math.sin(t*1.6)*1.4,o:1});
    // lupa varre as linhas
    const mt=seg(t,5.45,6.95), mx=eInOut(mt);
    const stepIdx=Math.min(2,Math.floor(mt*3)), local=(mt*3)%1, ph=local<0.5?eInOut(local*2):1-eInOut((local-0.5)*2);
    const cx=46+60+ph*170, cy=560+110+stepIdx*30+7;
    set($("#magn"),{x:cx-78, y:cy-78+bob, r:-6, s:eOutBack(seg(t,5.35,5.6))*(1-seg(t,6.95,7.15)), o:1});
    $("#magn").style.left="0px";$("#magn").style.top="0px";
    // faixa azul que "lê" a linha
    const hl=$("#hl"); hl.setAttribute("width",String(228*eInOut(clamp(mt*1.2))));hl.setAttribute("y",String(100+stepIdx*30));
    // visto
    set($("#badgeB"),{s:eOutBack(seg(t,6.95,7.4)),o:1}); }

  // marca d'água "M": canto diferente em cada cena, nunca sobre texto
  const wm=$("#wm"); wm.style.width=Math.round(48*1000/785)+"px";
  if(!inB){wm.style.left="962px";wm.style.top="40px";}else{wm.style.left="52px";wm.style.top="40px";}
  set(wm,{o:.30*seg(t,0.8,1.2)});

  // confete do visto (azul/branco)
  const bst=$("#burst"); if(!bst._ok){bst._ok=1;for(let i=0;i<10;i++){const p=document.createElement("div");p.className="abs pt";p.style.background=i%2?"#3B8BFF":"#0B1A3A";p.style.left="300px";p.style.top="520px";bst.appendChild(p);}}
  const bt=seg(t,6.95,7.8);[...bst.children].forEach((p,i)=>{const ang=i/10*Math.PI*2+0.3, d=eOutCubic(bt)*(110+(i%3)*30);
    set(p,{x:Math.cos(ang)*d+ 46+214+48-10, y:Math.sin(ang)*d+ 560-44+48-10, s:(1-bt)*(0.7+(i%3)*0.3),o:bt>0&&bt<1?1:0});p.style.left="0px";p.style.top="0px";});
};
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>{window.__ready=true;});
</script></body></html>
