<!-- Recriado da referência do dono (humor "Como trocar seu marido por uma casa!", 4 lâminas), 2026-11-27, refeito a pedido
     dele: fotos da própria referência (mão + prancheta reais), sem a marca da outra imobiliária (logo e numeração removidos,
     img/limpa.py no scratch). Lâmina 4 reescrita: "não pego seu marido na troca, mas te ajudo a financiar..." (corretor não
     financia). Originais em img/ref1-4.jpg. -->
<style>
*{box-sizing:border-box;margin:0;padding:0} body{background:#000}
.lamina{position:relative;width:1080px;height:1440px;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.topo{position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(180deg,rgba(8,17,46,.78) 0%,rgba(8,17,46,.5) 45%,rgba(8,17,46,0) 100%)}
.h{position:absolute;left:0;right:0;top:78px;text-align:center;font-family:Sora;font-weight:800;font-size:34px;letter-spacing:.08em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.num{position:absolute;right:60px;top:62px;font-family:Sora;font-weight:800;font-size:38px;color:#fff;background:#4C8DF6;border:4px solid #fff;border-radius:999px;padding:6px 26px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
</style></head><body>
<section class="lamina"><img class="bg" src="img/final1.jpg"><div class="topo"></div>
 <div class="h">@MHM.MACHADO</div><div class="num">1/4</div></section>
<section class="lamina"><img class="bg" src="img/final2.jpg"><div class="topo"></div>
 <div class="h">@MHM.MACHADO</div><div class="num">2/4</div></section>
<section class="lamina"><img class="bg" src="img/final3.jpg"><div class="topo"></div>
 <div class="h">@MHM.MACHADO</div><div class="num">3/4</div></section>
<section class="lamina"><img class="bg" src="img/final4.jpg"><div class="topo"></div>
 <div class="h">@MHM.MACHADO</div><div class="num">4/4</div></section>
</body></html>
