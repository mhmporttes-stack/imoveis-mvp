<!doctype html><html><head><meta charset="utf-8">
<meta name="fontes" content="family=Open+Sans:wght@400;600;800">
<style>
 *{margin:0;padding:0;box-sizing:border-box} body{background:transparent}
 .lamina{display:inline-block;padding:70px 90px 80px}
 .wrap{display:flex;align-items:center;gap:44px;font-family:"Open Sans",sans-serif;color:#EDEFF2;transform:rotate(-3deg);
   filter:drop-shadow(0 3px 10px rgba(0,0,0,.55)) drop-shadow(0 0 2px rgba(0,0,0,.35))}
 .simb{height:200px} .barra{width:5px;height:270px;background:#3673C2;border-radius:2px}
 .t{font-weight:800;font-size:84px;line-height:1.08;white-space:nowrap}
 .t em{font-style:normal;color:#3673C2}
 .t .zz{font-size:66px;vertical-align:6px;margin-left:10px}
 .pill{display:inline-flex;align-items:center;gap:16px;margin-top:24px;background:#3673C2;color:#fff;border-radius:999px;padding:12px 34px 14px 38px;
   font-weight:800;font-size:44px;letter-spacing:.12em;transform:rotate(2deg);box-shadow:0 0 0 4px #EDEFF2}
 .pill span{font-size:54px;letter-spacing:0}
 .brilho{position:absolute;font-size:46px}
 .regra{height:6px;width:calc(100% - 100px);background:#3673C2;margin:20px 0 16px;border-radius:2px}
 .sub{font-weight:600;font-size:38px;letter-spacing:.38em;white-space:nowrap}
 .sub span{letter-spacing:0;font-size:40px}
</style></head><body>
<section class="lamina"><div class="wrap"><img class="simb" src="../../../../public/assets/matheus-machado-symbol.png"><span class="barra"></span>
 <div style="position:relative"><div class="t">É FERIADO, MAS 😎</div><div class="t">ESTAMOS <em>ONLINE</em></div>
 <div class="regra"></div><div class="sub">PODE CHAMAR <span>✨</span></div></div></div></section>
</body></html>
