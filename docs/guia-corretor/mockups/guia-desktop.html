<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guia do Corretor · mockups desktop (1280 px) · conteúdo ilustrativo</title><style>:root{--f:Manrope,"Segoe UI",system-ui,-apple-system,sans-serif;--navy:#031D3A;--deep:#0B3A73;--blue:#3673C2;--blue-ink:#2D62AE;--sky:#8DB4EA;--pale:#EAF1FB;--paper:#fff;--desk:#E9EEF5;--ink:#0B1B2E;--ink2:#475569;--line:#D8E0EA;--amber-bg:#FFF4DB;--amber-ink:#6B4A00;--amber-line:#C98F10;--ok-bg:#E3F4EA;--ok-ink:#0F6B3F;--warn-bg:#FFEDD5;--warn-ink:#9A3412;--mute-bg:#F1F5F9}
*{box-sizing:border-box}
body{margin:0;background:#C9D3DF;font-family:Manrope,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.canvas{display:flex;flex-wrap:wrap;gap:44px 40px;padding:36px;justify-content:center;align-items:flex-start}
.fig{display:flex;flex-direction:column;gap:14px}
.cap{font:700 13.5px/1.35 var(--f);color:#1c2b3d;max-width:390px}
.cap small{display:block;font-weight:500;color:#3b4a5d;margin-top:3px;font-size:12.5px}
h1.sheet-title{font:800 22px/1.2 var(--f);text-align:center;margin:30px 0 -10px;color:#12233a}
button{font-family:inherit;font-size:inherit;font-weight:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}

/* ===== telefone ===== */
.phone{width:390px;height:844px;background:var(--desk);border-radius:38px;overflow:hidden;position:relative;box-shadow:0 0 0 9px #0d1522,0 22px 50px rgba(0,0,0,.28);display:flex;flex-direction:column}
.status{height:40px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 6px;font:700 13px var(--f);color:var(--ink)}
.status.dark{color:#fff}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--ink)}
.topbar .t{flex:1;min-width:0;font:700 15px/1.2 var(--f)}
.topbar .t small{display:block;font-weight:600;font-size:12.5px;color:var(--ink2)}
.topbar.dark{color:#fff}.topbar.dark .ibtn{color:#fff}.topbar.dark .t small{color:var(--sky)}
.body{flex:1;min-height:0;position:relative;overflow:hidden}

/* ===== home ===== */
.home-head{padding:6px 20px 0}
.home-head .eyebrow{font:700 12.5px var(--f);letter-spacing:.09em;text-transform:uppercase;color:var(--blue-ink);display:flex;align-items:center;gap:8px}
.home-head .eyebrow img{height:15px}
.home-head h2{font:800 30px/1.08 var(--f);letter-spacing:-.02em;margin:8px 0 14px}
.sfield{height:52px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ink2);font:600 15.5px var(--f);margin:0 16px;box-shadow:0 1px 0 rgba(3,29,58,.04)}
.sec{padding:18px 20px 8px;font:700 12.5px var(--f);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.recents{display:flex;flex-direction:column;margin:0 16px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.recent{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px;font:600 14.5px var(--f);border-top:1px solid var(--line)}
.recent:first-child{border-top:0}
.recent .trail{color:var(--ink2);font-weight:500;font-size:13px}
.recent .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .pg{font:700 12.5px var(--f);color:var(--ink2);font-variant-numeric:tabular-nums}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.cover{position:relative;height:118px;border-radius:5px 14px 14px 5px;padding:14px 14px 13px 20px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:#fff;box-shadow:0 6px 14px -6px rgba(3,29,58,.45),0 1px 0 rgba(255,255,255,.08) inset}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.1) 60%,rgba(0,0,0,.12))}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.055) 0 1px,transparent 1px 14px);pointer-events:none}
.cover .n{font:800 13px var(--f);letter-spacing:.14em;opacity:.92;position:relative;z-index:1}
.cover .tt{font:800 19px/1.08 var(--f);letter-spacing:-.015em;position:relative;z-index:1}
.cover .sub{font:600 12.5px/1.3 var(--f);margin-top:6px;opacity:.95}
.c1{background:var(--navy)}.c2{background:var(--deep)}.c3{background:var(--blue)}.c4{background:var(--pale);color:var(--navy);box-shadow:0 6px 14px -8px rgba(3,29,58,.4),0 0 0 1px var(--line) inset}
.c4::before{background:linear-gradient(90deg,rgba(3,29,58,.18),rgba(255,255,255,.4) 60%,rgba(3,29,58,.06))}
.c4::after{background:repeating-linear-gradient(135deg,rgba(3,29,58,.05) 0 1px,transparent 1px 14px)}
.cover.pend{background:var(--mute-bg);color:var(--ink2);box-shadow:0 0 0 1.5px var(--line) inset}
.cover.pend::before{background:rgba(3,29,58,.1)}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 12.5px/1 var(--f);border-radius:999px;padding:6px 10px}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}.chip.mute{background:var(--mute-bg);color:var(--ink2)}.chip.info{background:var(--pale);color:var(--blue-ink)}.chip.am{background:var(--amber-bg);color:var(--amber-ink)}
.wide{grid-column:1/-1;height:132px;padding:0;color:#fff;background:#1d3b5e}
.wide .ph{position:absolute;inset:0;background:linear-gradient(120deg,#294d7a,#6d93c0 55%,#a9c3e0)}
.wide .ph::after{content:"foto do cadastro";position:absolute;right:12px;top:10px;font:700 11.5px var(--f);color:rgba(255,255,255,.9);background:rgba(3,29,58,.55);padding:4px 8px;border-radius:6px}
.wide .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,29,58,.92),rgba(3,29,58,.1) 68%)}
.wide .txt{position:absolute;left:20px;right:14px;bottom:12px;z-index:2}
.wide::after{display:none}.wide .ph{z-index:0}.wide::before{z-index:3}
.foot-note{padding:16px 20px 20px;font:500 12.5px/1.4 var(--f);color:var(--ink2)}

/* ===== índice do livro ===== */
.bookhead{margin:4px 16px 8px;border-radius:5px 16px 16px 5px;background:var(--deep);color:#fff;padding:16px 16px 16px 24px;position:relative;overflow:hidden}
.bookhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.1) 60%,rgba(0,0,0,.12))}
.bookhead .n{font:800 12.5px var(--f);letter-spacing:.14em;color:var(--sky)}
.bookhead h3{font:800 26px/1.1 var(--f);letter-spacing:-.02em;margin:4px 0 4px}
.bookhead p{margin:0;font:600 13px/1.35 var(--f);color:#DCE8F8}
.toc{margin:6px 16px 0;background:#fff;border-radius:14px;border:1px solid var(--line)}
.toc .row{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 14px;border-top:1px solid var(--line)}
.toc .row:first-child{border-top:0}
.toc .num{font:800 20px var(--f);color:var(--blue-ink);width:30px;font-variant-numeric:tabular-nums}
.toc .tx{flex:1;min-width:0}
.toc .tx b{display:block;font:700 16px/1.2 var(--f)}
.toc .tx span{display:block;font:500 13px/1.3 var(--f);color:var(--ink2);margin-top:2px}
.toc .pg{font:700 13px var(--f);color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right;min-width:34px}
.toc .row.pending{background:var(--mute-bg);color:var(--ink2)}
.toc .row.pending .num{color:#6b7a8c}
.group-h{display:flex;align-items:center;gap:8px;margin:14px 20px 6px;font:700 12.5px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

/* ===== folha (página de conteúdo) ===== */
.stack{position:absolute;left:8px;right:8px;top:4px;bottom:76px}
.stack::before,.stack::after{content:"";position:absolute;inset:0;border-radius:12px;background:#F7F9FC;border:1px solid #DCE4EE}
.stack::before{transform:translate(6px,6px)}.stack::after{transform:translate(3px,3px);background:#FBFCFE}
.leaf{position:absolute;left:8px;right:8px;top:4px;bottom:76px;background:var(--paper);border-radius:12px;box-shadow:0 1px 0 #fff inset,0 0 0 1px #DCE4EE,0 10px 22px -12px rgba(3,29,58,.4);overflow:hidden;z-index:2;display:flex;flex-direction:column}
.leaf-in{padding:20px 20px 12px;flex:1;min-height:0;overflow:hidden;position:relative}
.leaf-in::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(0deg,#fff,rgba(255,255,255,0))}
.runhead{display:flex;justify-content:space-between;font:700 12px var(--f);letter-spacing:.09em;text-transform:uppercase;color:var(--blue-ink)}
.runhead span:last-child{color:var(--ink2);font-variant-numeric:tabular-nums}
.leaf h2{font:800 28px/1.08 var(--f);letter-spacing:-.022em;margin:10px 0 12px}
.lead{font:600 18.5px/1.38 var(--f);color:var(--ink);margin:0 0 16px}
.lbl{display:flex;align-items:center;gap:7px;font:800 12px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.steps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;font:500 16px/1.4 var(--f)}
.steps li i{font:800 18px/1.25 var(--f);font-style:normal;color:var(--blue-ink);width:20px;flex:none;font-variant-numeric:tabular-nums}
.warn{background:var(--amber-bg);border-left:4px solid var(--amber-line);border-radius:4px 10px 10px 4px;padding:12px 14px;margin:0 0 14px;color:var(--amber-ink)}
.warn .lbl{color:var(--amber-ink);margin-bottom:4px}
.warn p{margin:0;font:600 15px/1.4 var(--f)}
.ex{background:var(--pale);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.ex .lbl{color:var(--blue-ink);margin-bottom:4px}
.ex p{margin:0;font:500 15px/1.4 var(--f);color:var(--navy)}
.meta{font:500 12.5px/1.45 var(--f);color:var(--ink2);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.meta a{color:var(--blue-ink);font-weight:700;text-decoration:underline}
.src{font:600 11.5px/1 ui-monospace,Consolas,monospace;background:#fff4;border:1px dashed #6b7f99;color:#33465e;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle;background:#F2F6FB}

/* ===== barra inferior do livro ===== */
.bar{position:absolute;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px;z-index:6}
.bar .b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;height:56px;border:0;background:none;font:700 12px var(--f);color:var(--ink);border-radius:12px}
.bar .b.pri{background:var(--navy);color:#fff;width:56px;min-width:56px;border-radius:16px}
.bar .b.sec{background:var(--pale);color:var(--navy);width:56px;min-width:56px;border-radius:16px}
.bar .b.off{opacity:.38}
.bar .count{font:800 16px var(--f);font-variant-numeric:tabular-nums;text-align:center;min-width:56px}
.bar .count small{display:block;font:600 11.5px var(--f);color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== sheet índice ===== */
.dim{position:absolute;inset:0;background:rgba(3,29,58,.52);z-index:7}
.sheet{position:absolute;left:0;right:0;bottom:0;height:68%;background:#fff;border-radius:22px 22px 0 0;z-index:8;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(3,29,58,.25)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#C3CEDB;margin:10px auto 6px}
.sheet h4{margin:4px 20px 8px;font:800 18px var(--f);display:flex;justify-content:space-between;align-items:center}
.sheet .list{overflow:hidden;padding:0 8px}
.sheet .li{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 12px;border-radius:12px;font:700 15.5px var(--f)}
.sheet .li .num{font:800 17px var(--f);color:var(--blue-ink);width:26px}
.sheet .li .pg{margin-left:auto;font:700 13px var(--f);color:var(--ink2)}
.sheet .li.cur{background:var(--pale);box-shadow:inset 4px 0 0 var(--blue)}
.sheet .li small{display:block;font:600 12.5px var(--f);color:var(--blue-ink)}
.sheet .all{margin:auto 16px 18px;height:50px;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px var(--f)}

/* ===== busca ===== */
.sbar{display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;height:56px}
.sbar .f{flex:1;height:48px;border-radius:14px;background:#fff;border:2px solid var(--blue);display:flex;align-items:center;gap:8px;padding:0 12px;font:600 16px var(--f)}
.sbar .caret{width:2px;height:22px;background:var(--blue)}
.res{margin:6px 16px 0;display:flex;flex-direction:column;background:#fff;border-radius:14px;border:1px solid var(--line)}
.hit{padding:12px 14px;border-top:1px solid var(--line)}
.hit:first-child{border-top:0}
.hit .trail{font:700 12.5px/1.3 var(--f);color:var(--blue-ink);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hit .trail em{font-style:normal;color:var(--ink2)}
.hit b{display:block;font:700 16px/1.25 var(--f);margin:3px 0 2px}
.hit p{margin:0;font:500 14px/1.4 var(--f);color:var(--ink2)}
mark{background:#FFE08A;color:var(--ink);border-radius:3px;padding:0 2px}
.hint{margin:12px 20px 0;font:500 13px/1.4 var(--f);color:var(--ink2)}

/* ===== virada ===== */
.flip{perspective:2600px}
.leaf.moving{transform-origin:0 50%;transform:rotateY(-24deg);z-index:4;box-shadow:0 0 0 1px #DCE4EE,30px 14px 40px -10px rgba(3,29,58,.45);will-change:transform}
.leaf.moving::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0) 40%,rgba(3,29,58,.1) 100%);pointer-events:none}
.leaf.under{z-index:2}
.leaf.under::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,29,58,.32),rgba(3,29,58,0) 52%);z-index:3;pointer-events:none}
.ghost{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:6;background:rgba(3,29,58,.82);color:#fff;border-radius:999px;padding:8px 12px;font:700 12.5px var(--f)}

/* ===== pendente ===== */
.pending-page{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:34px}
.pending-page .ic{width:60px;height:60px;border-radius:18px;background:var(--mute-bg);color:var(--ink2);display:grid;place-items:center}
.pending-page h2{margin:6px 0 0;font-size:26px}
.pending-page p{margin:0;font:500 16px/1.5 var(--f);color:var(--ink2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;font:700 15.5px var(--f);padding:0 18px;border:1.5px solid var(--line);background:#fff;color:var(--ink);width:100%}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ===== empreendimentos ===== */
.elist{margin:6px 16px 0;display:flex;flex-direction:column;gap:12px}
.eitem{display:flex;gap:12px;background:#fff;border-radius:14px;border:1px solid var(--line);padding:8px;align-items:stretch}
.eitem .th{width:96px;min-height:88px;border-radius:9px;background:linear-gradient(130deg,#2f5483,#8fb0d3);position:relative;flex:none}
.eitem .th::after{content:"foto";position:absolute;left:6px;bottom:6px;font:700 11px var(--f);color:#fff;background:rgba(3,29,58,.55);padding:2px 6px;border-radius:5px}
.eitem .tx{padding:4px 4px 4px 0;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.eitem b{font:800 16px/1.2 var(--f)}
.eitem span{font:500 13.5px/1.35 var(--f);color:var(--ink2)}
.ecover{height:250px;position:relative;margin:0 8px;border-radius:14px 14px 0 0;overflow:hidden;background:linear-gradient(130deg,#274a77,#7ea3cc 60%,#b4cbe5)}
.ecover .tag{position:absolute;right:10px;top:10px;font:700 11.5px var(--f);color:#fff;background:rgba(3,29,58,.6);padding:4px 8px;border-radius:6px}
.ecover .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,29,58,.95),rgba(3,29,58,0) 70%)}
.ecover .tx{position:absolute;left:18px;right:14px;bottom:14px;color:#fff}
.ecover .tx small{font:700 12.5px var(--f);letter-spacing:.09em;text-transform:uppercase;color:var(--sky)}
.ecover .tx h3{margin:3px 0 0;font:800 26px/1.08 var(--f);letter-spacing:-.02em}
.dl{display:grid;grid-template-columns:104px 1fr;gap:10px 12px;margin:0 0 16px;font:500 15px/1.35 var(--f)}
.dl dt{font:700 12px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding-top:2px}
.dl dd{margin:0;font-weight:600}
.pics{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:84px 84px;gap:6px;margin:0 0 14px}
.pics div{border-radius:9px;background:linear-gradient(130deg,#3a6296,#9db9d8);position:relative}
.pics div:first-child{grid-row:1/3}
.pics div::after{content:"foto";position:absolute;left:6px;bottom:6px;font:700 11px var(--f);color:#fff;background:rgba(3,29,58,.55);padding:2px 6px;border-radius:5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}

/* ===== faixa de estado (admin / rascunho) ===== */
.ribbon{display:flex;align-items:center;gap:8px;padding:7px 14px;font:700 12.5px var(--f);background:var(--amber-bg);color:var(--amber-ink);border-bottom:1px solid #EBCB7A}

/* ================= DESKTOP ================= */
.desk{width:1280px;height:800px;background:var(--desk);border-radius:14px;overflow:hidden;position:relative;box-shadow:0 0 0 1px #aebccc,0 24px 50px -20px rgba(3,29,58,.5);display:flex;flex-direction:column}
.dtop{height:64px;flex:none;display:flex;align-items:center;gap:16px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
.dtop .brand{display:flex;align-items:center;gap:10px;font:800 15px var(--f)}
.dtop .brand img{height:24px}
.crumb{display:flex;align-items:center;gap:8px;font:600 14px var(--f);color:var(--ink2)}
.crumb b{color:var(--ink);font-weight:800}
.dtop .sp{flex:1}
.dsearch{width:360px;height:42px;border-radius:12px;background:var(--desk);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;font:600 14px var(--f);color:var(--ink2)}
.dsearch kbd{margin-left:auto;font:700 12px var(--f);background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink2)}
.dbtn{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:700 14px var(--f)}
.dbtn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.dmain{flex:1;min-height:0;position:relative}
.dhome{padding:34px 56px;display:grid;grid-template-columns:420px 1fr;gap:48px;height:100%}
.dhome h2{font:800 44px/1.04 var(--f);letter-spacing:-.025em;margin:8px 0 12px}
.dhome p.l{font:500 17px/1.5 var(--f);color:var(--ink2);margin:0 0 22px;max-width:380px}
.dshelf{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-content:start}
.dshelf .cover{height:206px;padding:18px 18px 16px 26px}
.dshelf .cover .tt{font-size:25px}
.dshelf .wide{grid-column:1/-1;height:156px}
.dshelf .wide .txt{left:28px;bottom:16px}

/* livro aberto */
.stage{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;padding-top:26px;background:radial-gradient(ellipse at 50% 40%,#F2F6FB 0,#E3EAF3 70%)}
.openbook{position:relative;width:960px;height:640px;display:flex;filter:drop-shadow(0 30px 28px rgba(3,29,58,.28))}
.openbook::before{content:"";position:absolute;left:-6px;right:-6px;bottom:-9px;height:14px;background:linear-gradient(#DCE4EE,#C3CFDD);border-radius:0 0 12px 12px;z-index:0}
.pgL,.pgR{position:relative;flex:1;background:#fff;z-index:1;overflow:hidden}
.pgL{border-radius:12px 0 0 12px;box-shadow:inset -34px 0 38px -26px rgba(3,29,58,.28)}
.pgR{border-radius:0 12px 12px 0;box-shadow:inset 34px 0 38px -26px rgba(3,29,58,.28)}
.pgL .in,.pgR .in{padding:46px 52px 40px;height:100%;position:relative}
.pgR .in{padding-left:60px}.pgL .in{padding-right:60px}
.pgnum{position:absolute;bottom:20px;font:700 12.5px var(--f);color:var(--ink2);font-variant-numeric:tabular-nums}
.pgL .pgnum{left:52px}.pgR .pgnum{right:52px}
.navarrow{position:absolute;top:84%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 8px 18px -8px rgba(3,29,58,.5);display:grid;place-items:center;z-index:5}
.navarrow.l{left:-76px}.navarrow.r{right:-76px}
.cornerhint{position:absolute;right:0;bottom:0;width:60px;height:60px;z-index:3;background:linear-gradient(135deg,transparent 50%,#DCE4EE 50%,#F7F9FC 62%,#fff 100%);border-radius:0 0 12px 0;box-shadow:-6px -6px 14px -8px rgba(3,29,58,.4)}
.tabs{position:absolute;right:-128px;top:44px;display:flex;flex-direction:column;gap:6px;z-index:0}
.tab{width:128px;height:44px;border-radius:0 10px 10px 0;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;font:700 13px/1.1 var(--f);box-shadow:0 4px 8px -4px rgba(3,29,58,.5)}
.tab i{font:800 14px var(--f);font-style:normal;opacity:.95}
.tab.cur{background:var(--navy);width:140px;margin-left:-6px}
.tab.alt{background:var(--deep)}
.tab.mute{background:#B9C6D6;color:var(--navy)}
.dfoot{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:10px;z-index:6;font:600 13px var(--f);color:var(--ink2)}
.dfoot span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;gap:8px;align-items:center}
.dfoot kbd{font:700 12px var(--f);background:var(--desk);border-radius:5px;padding:1px 6px;color:var(--ink)}
.opener .big{font:800 120px/0.9 var(--f);letter-spacing:-.04em;color:var(--pale);-webkit-text-stroke:0;margin:6px 0 0}
.opener .big b{color:var(--blue)}
.opener h2{font:800 46px/1.04 var(--f);letter-spacing:-.025em;margin:6px 0 12px}
.opener .purpose{font:500 18px/1.5 var(--f);color:var(--ink2);margin:0 0 28px}
.opener .pl{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.opener .pl div{display:flex;gap:14px;align-items:center;min-height:52px;border-bottom:1px solid var(--line);font:700 16px var(--f)}
.opener .pl div i{font:800 15px var(--f);font-style:normal;color:var(--blue-ink);width:24px}
.opener .pl div span{margin-left:auto;color:var(--ink2);font-size:13px}
.opener .pl div.cur{background:var(--pale);box-shadow:inset 4px 0 0 var(--blue);padding-left:10px;margin-left:-10px}
.pgR .lead{font-size:19px}
.pgR h2{font-size:30px}
.pgR .steps li{font-size:16px}

/* palette de busca */
.scrim{position:absolute;inset:0;background:rgba(3,29,58,.5);z-index:10}
.palette{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:760px;background:#fff;border-radius:18px;box-shadow:0 30px 70px -20px rgba(3,29,58,.7);z-index:11;overflow:hidden}
.palette .pin{display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;font:600 19px var(--f);border-bottom:1px solid var(--line)}
.palette .grp{padding:12px 20px 4px;font:800 12px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.palette .hit{padding:12px 20px;border:0;display:flex;gap:16px;align-items:flex-start}
.palette .hit.sel{background:var(--pale);box-shadow:inset 4px 0 0 var(--blue)}
.palette .hit .l{flex:1}
.palette .hit .go{font:700 12.5px var(--f);color:var(--ink2);display:flex;gap:6px;align-items:center;white-space:nowrap}
.palette .foot{display:flex;gap:16px;padding:10px 20px;border-top:1px solid var(--line);font:600 12.5px var(--f);color:var(--ink2);background:var(--mute-bg)}

/* empreendimento desktop */
.photoL{position:absolute;inset:0;background:linear-gradient(135deg,#27486f,#6f95c0 55%,#aec6e1)}
.photoL .tag{position:absolute;left:52px;top:46px;font:700 12px var(--f);color:#fff;background:rgba(3,29,58,.55);padding:4px 9px;border-radius:6px}
.photoL .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,29,58,.94),rgba(3,29,58,0) 60%)}
.photoL .tx{position:absolute;left:52px;right:60px;bottom:50px;color:#fff}
.photoL .tx small{font:700 13px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--sky)}
.photoL .tx h2{font:800 46px/1.04 var(--f);letter-spacing:-.025em;margin:6px 0 10px}
.photoL .tx p{margin:0;font:500 17px/1.45 var(--f);color:#DCE8F8}

/* admin */
.adm{display:grid;grid-template-columns:300px 1fr 330px;height:100%}
.adm .col{padding:20px 20px;overflow:hidden}
.adm .l{background:#fff;border-right:1px solid var(--line)}
.adm .r{background:#fff;border-left:1px solid var(--line)}
.adm h5{margin:0 0 10px;font:800 12px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.tree .bk{font:800 15px var(--f);margin:14px 0 4px}
.tree .ch{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 8px;border-radius:9px;font:600 14px var(--f)}
.tree .ch.cur{background:var(--pale);box-shadow:inset 3px 0 0 var(--blue)}
.tree .ch .chip{margin-left:auto;font-size:11.5px;padding:4px 8px}
.health{font:600 14px/1.5 var(--f);color:var(--ink2);padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.health b{color:var(--ink);font-weight:800}
.stepper{display:flex;gap:0;margin:8px 0 18px}
.stepper div{flex:1;font:700 12.5px var(--f);color:var(--ink2);text-align:center;padding-top:20px;position:relative}
.stepper div::before{content:"";position:absolute;left:0;right:0;top:6px;height:3px;background:var(--line)}
.stepper div::after{content:"";position:absolute;left:50%;top:0;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.stepper div.done::before{background:var(--blue)}.stepper div.done::after{border-color:var(--blue);background:var(--blue)}
.stepper div.done{color:var(--ink)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 10px;font:500 14px/1.4 var(--f);margin:0 0 18px}
.kv dt{font:700 12px var(--f);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);padding-top:2px}
.kv dd{margin:0;font-weight:600}
.adm .mid{display:flex;justify-content:center;padding:24px 0}
.sheetpv{width:430px;background:#fff;border-radius:12px;box-shadow:0 0 0 1px #DCE4EE,0 16px 30px -16px rgba(3,29,58,.45);padding:22px 24px;height:100%;overflow:hidden;position:relative}
.sheetpv::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(0deg,#fff,rgba(255,255,255,0))}
.note{font:500 13px/1.45 var(--f);color:var(--ink2);background:var(--mute-bg);border-radius:10px;padding:10px 12px;margin-top:6px}
.dis{opacity:.5}
/* ajustes pós-crítica */
.c1,.c2,.c3,.c4{background:var(--navy);color:#fff;box-shadow:0 6px 14px -6px rgba(3,29,58,.45),0 1px 0 rgba(255,255,255,.08) inset}
.c4::before{background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.1) 60%,rgba(0,0,0,.12))}
.c4::after{background:repeating-linear-gradient(135deg,rgba(255,255,255,.055) 0 1px,transparent 1px 14px)}
.cover{height:124px}
.home-head h2{font-size:26px;margin:6px 0 12px}
.lead{border-left:3px solid var(--blue);padding-left:12px}
.sheet{height:54%}
.bar .b.sec.off,.bar .b.pri.off{background:transparent;color:var(--ink);opacity:.28;box-shadow:inset 0 0 0 1.5px var(--line)}
.eitem{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0}
.elist{gap:0;margin-top:2px}.elist .eitem:first-child{border-top:0}
.opener .big{color:#D3E2F6}
.tree .ch .chip{font-size:12.5px}
.tab{font-size:13.5px}
.pgR .lead{font-size:20px}
.kv{font-size:15px}
