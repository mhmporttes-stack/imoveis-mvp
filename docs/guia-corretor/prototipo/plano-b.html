<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#E8EDF4">
<title>Livro de Exemplo · Plano B (StPageFlip)</title>
<style>
:root{
  --navy:#031D3A;--navy2:#0D3B66;--blue:#3673C2;--accent:#1F5FB5;
  --ink:#0F1B2D;--mut:#4B5B72;--line:#D9E1EC;--bg:#E8EDF4;--paper:#fff;
  --warn-bg:#FFF4D6;--warn-ink:#7A4E00;--warn-line:#E5A100;--ex-bg:#EAF1FB;
  --font:Manrope,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --top:56px;--barh:64px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #1F5FB5;outline-offset:2px;border-radius:6px}
.app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;background:
  radial-gradient(1200px 600px at 50% -10%,#f4f7fb 0,transparent 70%),var(--bg)}
@supports not (height:100dvh){.app{height:100vh}}

/* topo */
.top{flex:none;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0 10px;display:flex;align-items:center;gap:10px}
.logo{flex:none;width:36px;height:36px;border-radius:10px;background:var(--navy);display:grid;place-items:center;box-shadow:0 1px 2px rgba(3,29,58,.25)}
.logo img{width:22px;height:auto;display:block}
.titles{min-width:0;flex:1}
.titles h1{margin:0;font-size:15px;line-height:1.15;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{margin:1px 0 0;font-size:12px;line-height:1.2;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:700}
.crumb i{font-style:normal;margin:0 .35em;opacity:.6}
.chip{display:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-bg);border:1px solid #F0D68A;border-radius:999px;padding:5px 10px;white-space:nowrap}
.ibtn{flex:none;min-width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:inline-grid;place-items:center;padding:0 10px;font-weight:700;color:var(--navy)}
.ibtn:hover{background:rgba(3,29,58,.07)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn[hidden]{display:none}

/* corpo */
.main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.cover-wrap,.reader{position:absolute;inset:0;display:flex}
[hidden]{display:none!important}
.stage{position:relative;flex:1;display:grid;place-items:center;overflow:hidden;touch-action:pan-y;-webkit-tap-highlight-color:transparent;outline-offset:-4px;border-radius:8px}
.stage *{touch-action:pan-y}
body.dragging .stage,body.dragging .stage *{user-select:none;-webkit-user-select:none;cursor:grabbing}
.edge{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--navy);display:none;place-items:center;box-shadow:0 4px 14px rgba(3,29,58,.18);z-index:5;padding:0}
.edge svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.edge.prev{left:18px}.edge.next{right:18px}
.edge:disabled{opacity:.35;cursor:default}
.edge:hover:not(:disabled){background:var(--navy);color:#fff}

/* capa */
.cover-wrap{align-items:center;justify-content:center;overflow:auto;padding:8px 16px 20px}
.cover-col{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:420px;margin:auto}
.cover-card{position:relative;width:min(100%,340px);aspect-ratio:3/4;border:0;border-radius:6px 16px 16px 6px;text-align:left;padding:28px 26px;color:#fff;overflow:hidden;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px),linear-gradient(160deg,#0D3B66,#031D3A 70%);
  box-shadow:0 30px 50px -22px rgba(3,29,58,.6),0 8px 18px rgba(3,29,58,.25),inset 6px 0 10px -6px rgba(0,0,0,.55);display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s}
.cover-card:hover{transform:translateY(-3px)}
.cover-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.07) 60%,transparent)}
.cover-card .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9CC1F2}
.cover-card .logo{background:rgba(255,255,255,.08);width:48px;height:48px;border-radius:13px;box-shadow:none;margin-bottom:18px}
.cover-card .logo img{width:30px}
.cover-card h2{margin:0;font-size:clamp(30px,9vw,38px);line-height:1.02;letter-spacing:-.02em;font-weight:800}
.cover-card p{margin:10px 0 0;font-size:14px;line-height:1.4;color:#C9D7EA}
.cover-card .open{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:#fff;color:var(--navy);font-weight:800;font-size:15px;border-radius:12px;min-height:46px;padding:0 18px}
.cover-card .open svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cover-note{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-bg);border:1px solid #F0D68A;border-radius:10px;padding:8px 12px;text-align:center}
.cover-fx{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cover-fx .lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}

/* segmentado */
.seg{display:flex;gap:4px;background:#EEF2F8;border-radius:12px;padding:4px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:grid;place-items:center;min-height:44px;border-radius:9px;font-weight:700;font-size:14px;text-align:center;padding:0 6px}
.seg input:checked+span{background:var(--navy);color:#fff;box-shadow:0 1px 3px rgba(3,29,58,.3)}
.seg input:focus-visible+span{outline:3px solid #1F5FB5;outline-offset:2px}
.seg input:disabled+span{opacity:.4}
.hint{font-size:12.5px;line-height:1.4;color:var(--mut);margin:8px 0 0}

/* barra de baixo */
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));min-height:var(--barh);background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .tab{flex:none;min-width:64px;min-height:48px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--navy)}
.bar .tab:hover{background:rgba(3,29,58,.07)}
.bar .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pager{display:flex;align-items:center;gap:4px;flex:1;justify-content:center;max-width:340px}
.pager .count{flex:1;text-align:center;font-weight:800;font-size:15px;line-height:1.15;min-width:70px;font-variant-numeric:tabular-nums}
.pager .count small{display:block;font-weight:600;font-size:11px;color:var(--mut);white-space:nowrap}
.pbtn{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--navy);padding:0}
.pbtn.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.pbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pbtn:disabled{opacity:.35;cursor:default}
.keys{display:none;font-size:12px;color:var(--mut);gap:6px;align-items:center}
.keys kbd{font:inherit;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:#fff;color:var(--ink)}

/* página (conteúdo) */
.pg{height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-size:clamp(15.5px,calc(var(--pw,380px)*.036),18px);line-height:1.45}
.pg-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:clamp(18px,5.5%,34px) clamp(18px,6.5%,36px) 14px}
.pg-foot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px clamp(18px,6.5%,36px) 11px;border-top:1px solid #EDF1F7;font-size:11px;color:var(--mut);font-weight:700}
.pg-foot .t{letter-spacing:.05em;text-transform:uppercase;color:var(--warn-ink)}
.pg .eyebrow{font-size:.72em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 .5em}
.pg h2{margin:0 0 .5em;font-size:1.65em;line-height:1.08;letter-spacing:-.02em;font-weight:800;color:var(--navy)}
.pg h3{margin:1.1em 0 .3em;font-size:.78em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.pg p{margin:0 0 .8em}
.pg .lead{border-left:4px solid var(--blue);padding-left:.8em;font-size:1.12em;line-height:1.4;margin:.2em 0 1em;font-weight:600}
.pg ol.steps{list-style:none;counter-reset:s;margin:.2em 0 1em;padding:0}
.pg ol.steps li{counter-increment:s;display:flex;gap:.7em;margin:0 0 .65em}
.pg ol.steps li::before{content:counter(s);flex:none;font-weight:800;color:var(--accent);min-width:1em}
.pg .warn{background:var(--warn-bg);border-left:4px solid var(--warn-line);border-radius:4px 10px 10px 4px;padding:.7em .9em;margin:1em 0;font-size:.95em;color:#4a3000}
.pg .warn b,.pg .ex b{display:block;font-size:.72em;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.15em;color:var(--warn-ink)}
.pg .ex{background:var(--ex-bg);border-radius:10px;padding:.7em .9em;margin:1em 0;font-size:.95em}
.pg .ex b{color:var(--accent)}
.pg table{width:100%;border-collapse:collapse;margin:.4em 0 1em;font-size:.92em}
.pg th,.pg td{text-align:left;padding:.55em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.pg th{font-size:.78em;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.pg kbd{font:inherit;font-weight:700;font-size:.9em;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 .4em;background:#F6F8FB}
.pg mark{background:#FFE58F}
.toc{list-style:none;margin:.4em 0 0;padding:0}
.toc .ch{margin:.8em 0 .1em;font-size:.78em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.toc button{width:100%;min-height:44px;display:flex;align-items:center;gap:.7em;text-align:left;border:0;background:transparent;border-bottom:1px solid #EDF1F7;padding:.45em .1em;font-weight:700;color:var(--ink);border-radius:0}
.toc button:hover{background:#F3F6FB}
.toc .n{flex:none;color:var(--accent);min-width:2.2em;font-variant-numeric:tabular-nums}
.toc .ttl{flex:1}
.toc .pn{flex:none;color:var(--mut);font-weight:600;font-size:.88em}
.toc button[aria-current=true]{background:var(--ex-bg);box-shadow:inset 3px 0 0 var(--accent)}
.pg.idx .banner{background:linear-gradient(160deg,#0D3B66,#031D3A);color:#fff;border-radius:14px;padding:.7em 1em;margin:0 0 .3em}
.pg.idx .banner .k{font-size:.7em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9CC1F2}
.pg.idx .banner strong{display:block;font-size:1.5em;letter-spacing:-.02em;line-height:1.1;margin-top:.1em}
.pg.idx .banner span{display:block;font-size:.82em;color:#C9D7EA;margin-top:.3em}
.endpaper{background:linear-gradient(160deg,#0D3B66,#031D3A);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;height:100%}
.endpaper .logo{background:rgba(255,255,255,.08);box-shadow:none;width:56px;height:56px;border-radius:15px}
.endpaper .logo img{width:34px}
.endpaper b{font-size:20px;letter-spacing:-.01em}
.endpaper small{color:#9CC1F2;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px}

/* diálogos */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,29,58,.5);display:flex;align-items:flex-end;justify-content:center;animation:ovin .15s ease-out}
@keyframes ovin{from{opacity:0}}
.dlg{background:#fff;width:100%;max-width:560px;max-height:84dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(3,29,58,.3);animation:dup .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes dup{from{transform:translateY(24px);opacity:.6}}
.dlg-h{flex:none;display:flex;align-items:center;gap:8px;padding:10px 8px 6px 18px}
.dlg-h h2{margin:0;flex:1;font-size:17px;font-weight:800}
.dlg-b{flex:1;min-height:0;overflow:auto;padding:4px 14px 16px;-webkit-overflow-scrolling:touch}
.dlg .toc button{padding:.55em .4em;font-size:15.5px}
.dlg .toc{font-size:15.5px}
.sq{position:relative;margin:4px 4px 8px}
.sq input{width:100%;min-height:48px;border-radius:12px;border:2px solid var(--line);padding:0 14px;font-size:16px;background:#fff}
.sq input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(31,95,181,.2)}
.res{list-style:none;margin:0;padding:0}
.res button{width:100%;text-align:left;border:0;background:transparent;border-bottom:1px solid #EDF1F7;padding:10px 6px;min-height:44px;border-radius:0}
.res button:hover,.res button:focus-visible{background:#F3F6FB}
.res .cr{font-size:12px;font-weight:700;color:var(--accent)}
.res .rt{font-weight:800;margin:1px 0}
.res .sn{font-size:13.5px;color:var(--mut)}
.res mark{background:#FFE58F;color:inherit;border-radius:2px}
.empty{color:var(--mut);font-size:14px;padding:12px 6px}
.setgrp{margin:10px 4px 16px}
.setgrp h3{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(var(--barh) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
#dbg{position:fixed;left:8px;bottom:calc(var(--barh) + 10px + env(safe-area-inset-bottom));z-index:70;background:rgba(3,29,58,.88);color:#cfe3ff;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:6px 8px;border-radius:8px;pointer-events:none;white-space:pre-wrap;max-width:92vw;opacity:.92}
.fadein{animation:fin .14s ease-out}
@keyframes fin{from{opacity:.0}}

/* desktop */
@media (pointer:fine){.toc button{min-height:38px}}
@media (min-width:900px){
  .top{padding-left:22px;padding-right:22px}
  .titles h1{font-size:16px}.crumb{font-size:13px}
  .chip{display:inline-block}
  .edge{display:grid}
  .keys{display:flex}
  .bar{padding-left:22px;padding-right:22px}
  .dlg{border-radius:20px;max-height:80vh}
  .ov{align-items:center}
  .cover-col{flex-direction:row;max-width:860px;align-items:center;gap:48px}
  .cover-col .side{flex:1;display:flex;flex-direction:column;gap:14px}
}
@media (max-width:899px){.cover-col .side{width:100%;display:flex;flex-direction:column;gap:12px}}
@media (prefers-reduced-motion:reduce){.cover-card,.ov,.dlg,#toast,.fadein{animation:none!important;transition:none!important}}

.stage{--pw:380px;--ph:700px;--bw:380px}
.pb-root{width:var(--bw);height:var(--ph)}
.pb-page{background:#fff;overflow:hidden}
.pb-page .endpaper{height:100%}

</style>
</head>

  $('#btnCover').onclick = () => App.closeBook();
  $('#btnIndex').onclick = openIndex; $('#btnSearch').onclick = openSearch; $('#btnSearchTop').onclick = openSearch; $('#btnSettings').onclick = openSettings;
  $('#btnPrev').onclick = $('#edgePrev').onclick = () => App.go(-1);
  $('#btnNext').onclick = $('#edgeNext').onclick = () => App.go(1);
  /* links "data-go" dentro das páginas (índice) */
  $('#stage').addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) App.jump(+g.dataset.go); });
  document.addEventListener('keydown', e => {
    if (dlg) {
      if (e.key === 'Escape') { e.preventDefault(); closeDlg(); }
      if (e.key === 'Tab') {
        const f = [...dlg.ov.querySelectorAll('button:not([disabled]),input:not([disabled]),[tabindex="0"]')].filter(n => n.offsetParent !== null);
        if (!f.length) return; const a = f[0], z = f[f.length - 1];
        if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
      }
      return;
    }
    if (App.view !== 'book') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target; if (t && t.matches && t.matches('input,textarea,select')) return;
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': e.preventDefault(); App.go(1); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); App.go(-1); break;
      case 'i': case 'I': e.preventDefault(); openIndex(); break;
      case '/': e.preventDefault(); openSearch(); break;
      case 'Home': if (!(t && t.classList && t.classList.contains('pg-scroll'))) { e.preventDefault(); App.jump(0); } break;
    }
  });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => App.relayout(), 60); });
  if (window.ResizeObserver) new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => App.relayout(), 60); }).observe($('#stage'));
  const onMq = () => { App.reduced = mq.matches; syncFx(); App.relayout(true); if (App.view === 'book') App.changed(); };
  if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
  window.addEventListener('hashchange', fromHash);
  fromHash();
  if (DEBUG) debugPanel();
}
function fromHash() {
  const m = /^#([^\/]+)(?:\/(\d+)(?:\/(\d+))?)?$/.exec(location.hash);
  if (!m) { if (App.view === 'book' && location.hash === '') App.closeBook(); return; }
  if (m[1] !== SLUG) { toast('Link não encontrado: abri o índice.'); return App.openBook(0); }
  let target = 0;
  if (m[2]) {
    const c = +m[2], p = +(m[3] || 1);
    const idx = c === 0 ? 0 : PAGES.findIndex(x => x.ch === c && x.n === p);
    if (idx < 0) { toast('Esse capítulo/página não existe: abri o índice.'); target = 0; } else target = idx;
  }
  if (App.view === 'book') { if (App.page !== target) App.jump(target); } else App.openBook(target);
}
function debugPanel() {
  const d = $('#dbg'); d.hidden = false; let n = 0, t0 = performance.now(), fps = 0, worst = 0, prev = t0;
  const loop = t => { n++; worst = Math.max(worst, t - prev); prev = t; if (t - t0 >= 500) { fps = Math.round(n * 1000 / (t - t0)); n = 0; t0 = t; paint(); worst = 0; } requestAnimationFrame(loop); };
  const paint = () => {
    const L = App.stats.last, l = L[0];
    d.textContent = `FPS ${fps} · pior quadro ${worst.toFixed(0)} ms (0,5 s)\n` +
      `${App.engine.name} · efeito ${App.effect}${App.reduced ? ' (movimento reduzido)' : ''} · ${App.layout.mode}\n` +
      `núcleos ${navigator.hardwareConcurrency || '?'} · mem ${navigator.deviceMemory || '?'} GB · dpr ${devicePixelRatio}\n` +
      (l ? `última virada: ${l.n} quadros, média ${(l.sum / l.n).toFixed(1)} ms, máx ${l.max.toFixed(0)} ms, lentos(>20) ${l.slow}\n` : 'última virada: —\n') +
      (L.length > 1 ? `anteriores (médias): ${L.slice(1).map(x => (x.sum / x.n).toFixed(1)).join(' / ')} ms` : '');
  };
  requestAnimationFrame(loop);
}

/* ===== MOTOR DO PLANO B (proxy): StPageFlip puro (page-flip 2.0.7, MIT) carregado por <script> da CDN ===== */
const Engine = (() => {
  let host, app, pf = null, off = 0, total = 0, dblMode = false;
  const cur = () => { try { return pf.getCurrentPageIndex(); } catch (e) { return 0; } };
  const vis = () => {
    const i = cur(); const raw = dblMode ? [i, i + 1] : [i];
    return raw.map(k => k - off).filter(k => k >= 0 && k < N);
  };
  const sync = () => { const v = vis(); if (v.length && !v.includes(app.page)) { app.page = v[v.length - 1]; } app.changed(); };
  return {
    name: 'Plano B (proxy): StPageFlip 2.0.7',
    fixedEffect: 'real',
    init(h, a) { host = h; app = a; },
    rebuild() {
      if (pf) { try { pf.destroy(); } catch (e) { } pf = null; }
      host.innerHTML = '';
      if (typeof St === 'undefined') { host.append(el('p', 'empty', 'Não consegui carregar o motor StPageFlip da CDN. Este teste precisa de internet.')); return; }
      dblMode = app.layout.mode === 'double'; off = dblMode ? 1 : 0;
      const { pw, ph, bw } = app.layout;
      const root = el('div', 'pb-root'); root.style.width = bw + 'px'; root.style.height = ph + 'px'; host.append(root);
      const items = [];
      const add = node => { const p = el('div', 'pb-page'); p.dataset.density = 'soft'; p.append(node); items.push(p); };
      if (dblMode) add(app.endEl('Livro de Exemplo', 'Conteúdo de teste'));
      for (let i = 0; i < N; i++) add(app.pageEl(i));
      if (dblMode && items.length % 2) add(app.endEl('Fim do livro de teste', 'Conteúdo de teste'));
      total = items.length;
      items.forEach(p => root.append(p));
      let startIdx = app.page + off; if (dblMode) startIdx &= ~1;
      pf = new St.PageFlip(root, {
        width: pw, height: ph, size: 'fixed', usePortrait: true, showCover: false, startPage: startIdx,
        drawShadow: true, maxShadowOpacity: .5, flippingTime: 300, swipeDistance: 20,
        mobileScrollSupport: true, useMouseEvents: true, clickEventForward: true, showPageCorners: true, startZIndex: 5,
      });
      pf.loadFromHTML(items);
      pf.on('flip', sync);
      items.forEach(p => p.querySelectorAll('.pg-scroll').forEach(s => s.tabIndex = 0));
    },
    resize() { /* o StPageFlip em modo fixo não redimensiona sozinho: reconstrói */ if (pf) this.rebuild(); },
    canGo(dir) { if (!pf) return false; const i = cur(); return dir > 0 ? i + (dblMode ? 2 : 1) < total : i > 0; },
    go(dir) { if (!this.canGo(dir)) return false; if (dir > 0) pf.flipNext('bottom'); else pf.flipPrev('bottom'); return true; },
    jump(i) { if (!pf) return; let k = i + off; if (dblMode) k &= ~1; pf.turnToPage(k); },
    visible: vis,
  };
})();
boot(Engine);
