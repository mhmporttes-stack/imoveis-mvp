<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Seguidor Instagram</title>
  <link rel="stylesheet" href="painel.css">
  <style>body { width: 360px; padding: 12px; }</style>
</head>
<body>
  <div class="linha entre" style="margin-bottom:10px">
    <h1>Seguidor Instagram</h1>
    <span id="status" class="pilula ligada">…</span>
  </div>

  <div id="caixaAlerta" class="cartao alerta" hidden>
    <strong>Atenção</strong>
    <div id="textoAlerta" style="white-space:pre-line;word-break:break-word"></div>
    <button id="btnRetomarAgora" class="perigo" style="margin-top:8px" hidden>Retomar agora</button>
  </div>

  <div class="cartao">
    <div class="suave">Próxima ação</div>
    <div id="proxima">—</div>
  </div>

  <div class="cartao">
    <h2>Hoje</h2>
    <div class="grade">
      <div><div class="num" id="cSeguidos">0</div><div class="suave">seguidos (de <span id="cLimite">15</span>)</div></div>
      <div><div class="num" id="cDeixados">0</div><div class="suave">deixados de seguir</div></div>
      <div><div class="num" id="cFollowBacks">0</div><div class="suave">seguiram de volta</div></div>
      <div><div class="num" id="cDms">0</div><div class="suave">DMs enviadas</div></div>
    </div>
    <div class="suave" style="margin-top:8px">Fila: <strong id="tamFila">0</strong> perfis · origem atual: <span id="origemAtual">—</span></div>
  </div>

  <div class="cartao">
    <div id="boasVindas" style="white-space:pre-line;word-break:break-word">Boas-vindas: …</div>
    <button id="btnConferir" class="secundario" style="margin-top:8px">Conferir seguidores agora</button>
    <div class="suave" id="resultadoConferir" style="margin-top:6px;white-space:pre-line;word-break:break-word"></div>
  </div>

  <div class="cartao">
    <h2>Perfil de referência</h2>
    <div class="linha">
      <input type="text" id="origem" placeholder="@perfil" autocomplete="off">
      <button id="btnBuscar">Buscar</button>
    </div>
    <div class="suave" id="resultadoBusca" style="margin-top:6px;white-space:pre-line;word-break:break-word"></div>
  </div>

  <div class="cartao">
    <div class="suave">Janela de trabalho (só da extensão)</div>
    <div id="textoJanela" style="margin:4px 0 8px">verificando…</div>
    <button id="btnAbrirJanela" class="secundario">Abrir janela de trabalho</button>
  </div>

  <div class="linha">
    <button id="btnPausar" class="secundario" style="flex:1">Pausar</button>
    <button id="btnRetomar" style="flex:1">Retomar</button>
    <button id="btnPainel" class="secundario">Painel</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
